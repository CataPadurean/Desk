     "trigger": "DXY slab + randamente reale care nu mai urcă; breakout M5 din M30 cu retest",
     "invalidation": "10Y peste 4,50% / DXY peste 101; trendul mare descendent intact — NU e trade de poziție"
    }
   ]
  }
 ]
};
</script>
<script>
(function () {
  var W = ((window.ARCHIVE_DATA || {}).weeks || []).slice().reverse();   // cea mai recentă prima
  var CRIT = ['cb','bnk','ind','yld','cot','reg','sea'];
  var LBL = { cb:'CB', bnk:'BNK', ind:'IND', yld:'YLD', cot:'COT', reg:'REG', sea:'SEA' };
  var ORDER = { Swing:['EURUSD','GBPUSD','USDCAD','USDJPY','USDCHF','AUDUSD','NZDUSD',
                       'EURGBP','EURJPY','GBPJPY','AUDNZD','CADJPY','GBPNZD'],
                Intraday:['US30','GOLD'] };
  var STAGE = { LIVE:0, ARMED:1, WATCH:2 };

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function dec(x){ return (x==null||isNaN(x)) ? '—' : Number(x).toFixed(1).replace('.',','); }
  function cls(x){ return x>0?'pos':(x<0?'neg':''); }
  function dirBadge(d){
    var u=String(d||'').toUpperCase();
    var c = u.indexOf('SHORT')>-1 ? 'b-short' : u.indexOf('LONG')>-1 ? 'b-long' : 'b-watch';
    if (u.indexOf('WATCH')===0) c='b-watch';
    return '<span class="badge '+c+'">'+d+'</span>';
  }
  function cell(v, why, k){
    if (v==null) return '<td class="c"><span class="cell na" title="'+esc(why||'indisponibil')+'">n/a</span></td>';
    var c = v>=2?'p2':v===1?'p1':v===0?'z':v===-1?'n1':'n2';
    return '<td class="c"><span class="cell '+c+'" title="'+esc(LBL[k]+' '+(v>0?'+':'')+v+(why?' — '+why:''))+'">'+
           (v>0?'+':'')+v+'</span></td>';
  }
  function bar(t){
    var w = Math.min(Math.abs(t)/10,1)*50;
    return '<span class="bar"><i class="mid"></i><i class="'+(t>=0?'gp':'gn')+'" style="'+
           (t>=0?'left:50%':'right:50%')+';width:'+w+'%"></i></span>';
  }

  function render(i){
    var e = W[i]; if (!e) return;
    var sc = e.scorecard||{}, cur = sc.currencies||{}, th = sc.thresholds||{};
    var pairs = sc.pairs||[], sub = pairs.filter(function(p){ return p.verdict==='SUB PRAG'; });

    var h = '<div class="meta">Regim: <b>'+esc((e.regime||{}).label||'—')+'</b>' +
      ((e.regime||{}).score!=null ? ' (scor '+((e.regime.score>0?'+':'')+e.regime.score)+')' : '') +
      ' · analiza: <b>'+esc(e.analysis_date||'—')+'</b> · date: <b>'+esc(e.data_generated||'—')+'</b>' +
      ' · arhivat: <b>'+esc((e.archived||'').slice(0,10))+'</b></div>';

    // ——— scorecard ———
    h += '<div class="card"><h2>Currency Scorecard</h2><table><tr><th>Currency</th>' +
      CRIT.map(function(k){ return '<th class="c" title="pondere '+((sc.weights||{})[k]||'')+'">'+LBL[k]+'</th>'; }).join('') +
      '<th>Score</th></tr>' +
      (sc.ranked||[]).map(function(c){
        var r = cur[c]||{};
        return '<tr><td><span class="rk">'+r.rank+'</span><b>'+c+'</b>' +
          (r.contra ? ' <span class="badge b-watch" title="'+esc(r.contra)+'">⚔</span>' : '') +
          (r.catalyst ? ' <span class="cat">'+esc(r.catalyst)+'</span>' : '') + '</td>' +
          CRIT.map(function(k){ return cell((r.scores||{})[k], (r.why||{})[k], k); }).join('') +
          '<td class="tot"><b class="'+cls(r.total)+'">'+(r.total>0?'+':'')+dec(r.total)+'</b>'+bar(r.total||0) +
          (r.missing&&r.missing.length ? '<span class="blind" title="criterii fără date — scor normalizat pe restul">orb: '+r.missing.join(', ')+'</span>' : '') +
          '</td></tr>'; }).join('') + '</table>' +
      (sub.length ? '<div class="sub"><span class="lbl">sub prag · fără trade</span><span class="items">' +
          sub.map(function(p){ return p.pair+' <b>'+dec(Math.abs(p.gap))+'</b>'; }).join(' · ') +
          '</span><span class="th">watch de la '+dec(th.watch)+' · book de la '+dec(th.book)+'</span></div>' : '') +
      '</div>';

    // ——— book ———
    var gaps = {}; pairs.forEach(function(p){ gaps[p.pair]=p; });
    var book = (e.trades||[]).slice();
    h += '<div class="card"><h2>Trades</h2>' + (book.length
      ? '<table><tr><th>Instrument</th><th>Direction</th><th>Rank gap</th><th>Conviction</th>' +
        '<th>Catalyst</th><th>Drivers</th><th>Trigger</th><th>Invalidation</th></tr>' +
        ['Swing','Intraday'].map(function(g){
          var rows = book.filter(function(t){ return t.type===g; }).sort(function(a,b){
            var sa=STAGE[String(a.stage).toUpperCase()], sb=STAGE[String(b.stage).toUpperCase()];
            sa=sa===undefined?9:sa; sb=sb===undefined?9:sb;
            if (sa!==sb) return sa-sb;
            var ga=Math.abs(a.gap==null?-1:a.gap), gb=Math.abs(b.gap==null?-1:b.gap);
            if (ga!==gb) return gb-ga;
            return ORDER[g].indexOf(a.instrument)-ORDER[g].indexOf(b.instrument);
          });
          if (!rows.length) return '';
          return '<tr class="grp"><td colspan="8">'+g+'</td></tr>' + rows.map(function(t){
            var p = gaps[t.instrument]||{};
            var d = String(t.dir||'').toUpperCase(), st = String(t.stage||'').toUpperCase();
            var shown = (d==='LONG'||d==='SHORT') && (st==='WATCH'||st==='LIVE') ? st+' - '+d : d;
            return '<tr><td><b>'+t.instrument+'</b>' +
              (p.cross ? ' <span class="tag" title="cross — spread mai larg, fără raport dedicat">cross</span>' : '') +
              (p.blind&&p.blind.length ? '<span class="blind" title="criteriu fără date pe unul dintre picioare">orb: '+p.blind.join(', ')+'</span>' : '') +
              '</td><td>'+dirBadge(shown)+'</td>' +
              '<td>'+(t.gap!=null ? '<span class="badge '+(t.verdict==='BOOK'?'b-book':'b-watch')+'" title="'+esc(t.verdict||'')+'">'+dec(Math.abs(t.gap))+'</span>' : '<span class="dim">—</span>')+'</td>' +
              '<td class="small">'+esc(t.conf||'—')+'</td>' +
              '<td class="small">'+esc(t.catalyst||'—')+'</td>' +
              '<td class="small">'+esc(t.drivers||'—')+'</td>' +
              '<td class="small">'+esc(t.trigger||'—')+'</td>' +
              '<td class="small">'+esc(t.invalidation||'—')+'</td></tr>'; }).join('');
        }).join('') + '</table>'
      : '<div class="empty">Nicio idee în book în săptămâna asta.</div>') + '</div>';

    document.getElementById('view').innerHTML = h;
    var tabs = document.querySelectorAll('.wk');
    for (var j=0;j<tabs.length;j++) tabs[j].className = 'wk' + (j===i ? ' on' : '');
  }

  if (!W.length) {
    document.getElementById('view').innerHTML =
      '<div class="empty">Arhiva e goală. Rulează <code>archive_week.py</code> ca să salvezi săptămâna curentă.</div>';
    return;
  }
  document.getElementById('weeks').innerHTML = W.map(function(e,j){
    return '<div class="wk'+(j===0?' on':'')+'" data-i="'+j+'">'+esc(e.week||'—')+'</div>'; }).join('');
  var tabs = document.querySelectorAll('.wk');
  for (var j=0;j<tabs.length;j++) (function(t){
    t.addEventListener('click', function(){ render(parseInt(t.getAttribute('data-i'),10)); });
  })(tabs[j]);
  render(0);
})();
</script>
</body>
</html>
