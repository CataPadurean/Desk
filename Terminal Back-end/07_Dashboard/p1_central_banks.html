<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Padu Terminal — Central Banks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome"></div>

  <div class="card">
    <h2>Policy vs. Market Pricing</h2>
    <div id="pricing"></div>
  </div>

  <div class="grid2" id="ccys"></div>


<script src="data.js"></script>
<script src="analysis_data.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  renderChrome('p1');
  var D = window.ANALYSIS_DATA || {};
  var cy = D.currencies || {};
  var CORD = ['USD', 'EUR', 'GBP', 'CAD', 'JPY', 'CHF', 'AUD', 'NZD'];

  // ——— Policy vs. Market Pricing ———
  var PR = D.pricing || {};
  function edgeBadge(dir) {
    if (!dir) return '<span class="dim">—</span>';
    var u = String(dir).toUpperCase();
    var cls = u.indexOf('NEUTRU') === 0 ? 'b-flat' : (u.indexOf('ANTI') === 0 ? 'b-short' : 'b-long');
    return '<span class="badge ' + cls + '">' + dir + '</span>';
  }
  document.getElementById('pricing').innerHTML = Object.keys(PR).length
    ? '<table><tr><th>Currency</th><th>Market pricing</th><th>Desk view</th><th>Edge</th><th>Divergence</th></tr>' +
      CORD.filter(function (k) { return PR[k]; }).map(function (k) {
        var p = PR[k];
        return '<tr>' +
          '<td><b>' + k + '</b></td>' +
          '<td class="small">' + (p.market || '—') + '</td>' +
          '<td class="small">' + (p.view || '—') + '</td>' +
          '<td class="small">' + (p.edge || '—') + '</td>' +
          '<td>' + edgeBadge(p.dir) + '</td>' +
        '</tr>'; }).join('') + '</table>'
    : '<div class="empty">Se populează la „generează teza săptămânală".</div>';

  document.getElementById('ccys').innerHTML = Object.keys(cy).length
    ? CORD.filter(function (k) { return cy[k]; }).map(function (k) {
        var c = cy[k];
        return '<div class="ccy">' +
          '<div class="hd"><h3>' + k + '</h3><span class="tag">' + (c.core ? 'CORE' : 'SECONDARY') + '</span>' + dirBadge(c.bias) + '</div>' +
          '<div class="blk" style="margin-bottom:0"><b>Central Bank Outlook</b><p>' + (c.cb || '—') + '</p></div>' +
        '</div>'; }).join('')
    : '<div class="empty" style="grid-column:1/-1">Se populează la „procesează inbox" / „generează teza".</div>';
})();
</script>
</body>
</html>
