<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Padu Terminal — Economic Indicators</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome"></div>

  <div class="card">
    <h2 id="surp-h">Surprise index — actual vs. consensus</h2>
    <div id="surp"></div>
  </div>

  <div class="card">
    <h2>Macro state per currency</h2>
    <div id="ind"></div>
  </div>

<script src="data.js"></script>
<script src="analysis_data.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  renderChrome('p3');
  var D = window.ANALYSIS_DATA || {};
  var I = D.indicators || {};
  var ORD = ['USD', 'EUR', 'GBP', 'CAD', 'JPY', 'CHF', 'AUD', 'NZD'];
  var cy = D.currencies || {};

  // ——— Surprise index (criteriul 3, cuantificat): update_indicators.py ———
  var S = D.indicators_calc || null;
  var SC = (S && S.currencies) || {};
  if (S) {
    document.getElementById('surp-h').innerHTML =
      'Surprise index — actual vs. consensus <span class="small">' +
      S.window_days + 'd · ' + (S.source || '') + '</span>';
  }
  function scoreCell(v) {
    if (v === null || v === undefined) return '<span class="dim">— blind</span>';
    var c = v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
    return '<b class="' + c + '">' + (v > 0 ? '+' : '') + v + '</b>';
  }
  document.getElementById('surp').innerHTML = Object.keys(SC).length
    ? '<table><tr><th>Currency</th><th class="c">Weighted surprise</th><th class="c">Score</th>' +
        '<th class="c">Releases</th><th>Main contributors</th></tr>' +
      ORD.filter(function (k) { return SC[k]; }).map(function (k) {
        var s = SC[k];
        var top = (s.top || []).map(function (t) {
          return t.name + ' <b class="' + (t.z > 0 ? 'pos' : (t.z < 0 ? 'neg' : '')) + '">' +
                 (t.z > 0 ? '+' : '') + t.z + 'σ</b>'; }).join(' · ') || '—';
        return '<tr><td><b>' + k + '</b></td>' +
          '<td class="c ' + (s.z > 0 ? 'pos' : (s.z < 0 ? 'neg' : 'dim')) + '">' +
            (s.z === null || s.z === undefined ? '—' : (s.z > 0 ? '+' : '') + s.z + 'σ') + '</td>' +
          '<td class="c">' + scoreCell(s.score) + '</td>' +
          '<td class="c dim">' + (s.n || 0) + '</td>' +
          '<td class="small">' + top + '</td></tr>'; }).join('') + '</table>'
    : '<div class="empty">Rulează update_indicators.py — până atunci criteriul 3 merge pe etichetele manuale din Macro state.</div>';

  function surpBadge(s) {
    if (!s) return '<span class="dim">—</span>';
    var u = s.toLowerCase();
    var cls = u.indexOf('pozitiv') > -1 ? 'b-long' : u.indexOf('negativ') > -1 ? 'b-short' : u.indexOf('mixt') > -1 ? 'b-watch' : 'b-flat';
    return '<span class="badge ' + cls + '">' + s + '</span>';
  }

  document.getElementById('ind').innerHTML = Object.keys(I).length
    ? '<table><tr><th>Currency</th>' +
        '<th class="c">GDP</th><th class="c">Interest<br>rate</th><th class="c">CPI</th><th class="c">Unemployment</th>' +
        '<th>Net surprise</th><th>Desk read</th><th>Bias</th></tr>' +
      ORD.filter(function (k) { return I[k]; }).map(function (k) {
        var m = I[k], c = cy[k] || {};
        return '<tr>' +
          '<td><b>' + k + '</b> <span class="small">' + (c.core ? 'core' : 'secondary') + '</span></td>' +
          '<td class="c">' + (m.gdp || '—') + '</td>' +
          '<td class="c">' + (m.rate || '—') + '</td>' +
          '<td class="c">' + (m.cpi || '—') + '</td>' +
          '<td class="c">' + (m.unemp || '—') + '</td>' +
          '<td>' + surpBadge(m.surprise) + '</td>' +
          '<td class="small">' + (m.read || '—') + '</td>' +
          '<td>' + dirBadge(c.bias) + '</td>' +
        '</tr>'; }).join('') + '</table>'
    : '<div class="empty">Se populează la „procesează inbox" / „generează teza".</div>';

})();
</script>
</body>
</html>
