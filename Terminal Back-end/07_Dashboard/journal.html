<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Padu Terminal — Journal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome"></div>
  <div class="tabs" id="tabs-s">
    <div class="tab on" data-f="TOT">TOTAL</div>
    <div class="tab" data-f="A">SWING</div>
    <div class="tab" data-f="B">INTRADAY</div>
  </div>
  <div class="tabs" id="tabs-p">
    <div class="tab on" data-p="TOT">ALL PHASES</div>
    <div class="tab" data-p="Evaluation">EVALUATION</div>
    <div class="tab" data-p="Funded">FUNDED</div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="card"><h2>Performance curve (cumulative R)</h2><div id="curve"></div></div>
    <div class="card"><h2>Per setup — expectancy</h2><div id="setups"></div></div>
  </div>
  <div class="card"><h2>Idea → execution</h2><div id="link"></div></div>
  <div class="card"><h2>Research history</h2><div id="hist"></div></div>
<script src="data.js"></script>
<script src="analysis_data.js"></script>
<script src="history_data.js"></script>
<script src="journal_data.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  renderChrome('journal');
  const D = window.DESK_DATA || { accounts: [] };
  const TR = (window.JOURNAL_DATA || {}).trades || [];  // P&L local (journal_data.js, în .gitignore)

  // ——— indexul ideilor: book-ul activ + arhiva de research ———
  // Cheia = ID-ul ideii. Aici se întâlnesc cele două straturi care nu trebuie confundate:
  // ce a propus terminalul (ideea) și ce a executat contul (trade-ul).
  const IDEAS = {};
  (D.trades || []).forEach(function (t) {
    var id = ideaId(t); if (id) IDEAS[id] = { src: 'book', o: t };
  });
  ((window.HISTORY_DATA || {}).entries || []).forEach(function (e) {
    var id = ideaId(e); if (id) IDEAS[id] = { src: 'history', o: e };
  });

  const SETUPS = ['Breakout', 'Retest', 'Retragere', 'News T1', 'Breaking news', 'Alt'];
  const fmt = (x, d) => (x === null || isNaN(x)) ? '—' : x.toFixed(d === undefined ? 2 : d);
  const pct = x => (x === null || isNaN(x)) ? '—' : (100 * x).toFixed(0) + '%';
  let F = 'TOT', P = 'TOT';

  function sel() {
    return TR.filter(t => (F === 'TOT' || t.strategy === F) &&
                          (P === 'TOT' || (t.phase || '') === P));
  }
  function closed(ts) { return ts.filter(t => t.r !== null && t.r !== undefined); }

  function stats(ts) {
    const n = ts.length;
    if (!n) return { n: 0, wr: null, aw: null, al: null, tot: 0, exp: null, comp: null, linked: null };
    const w = ts.filter(t => t.r > 0), l = ts.filter(t => t.r < 0);
    const tot = ts.reduce((s, t) => s + t.r, 0);
    const withRule = ts.filter(t => t.rulesOk === 'DA' || t.rulesOk === 'NU');
    return {
      n, wr: w.length / n,
      aw: w.length ? w.reduce((s, t) => s + t.r, 0) / w.length : null,
      al: l.length ? l.reduce((s, t) => s + t.r, 0) / l.length : null,
      tot, exp: tot / n,
      comp: withRule.length ? withRule.filter(t => t.rulesOk === 'DA').length / withRule.length : null,
      linked: ts.filter(t => t.ideaRef).length / n
    };
  }
  const cls = x => (x === null || isNaN(x)) ? '' : (x > 0 ? 'pos' : (x < 0 ? 'neg' : ''));

  function outBadge(o) {
    if (!o) return '<span class="dim">—</span>';
    var u = String(o).toUpperCase();
    var c = /^VALIDAT/.test(u) ? 'b-long' : /INVALIDAT/.test(u) ? 'b-short'
          : /EXPIRAT|NEACTIVAT/.test(u) ? 'b-watch' : 'b-flat';
    return '<span class="badge ' + c + '">' + o + '</span>';
  }

  function render() {
    const all = sel(), ts = closed(all), s = stats(ts);
    document.getElementById('kpis').innerHTML = [
      ['Closed trades', s.n, ''],
      ['Win rate', pct(s.wr), ''],
      ['Expectancy (R)', fmt(s.exp), cls(s.exp)],
      ['Total R', fmt(s.tot), cls(s.tot)],
      ['Avg win (R)', fmt(s.aw), 'pos'],
      ['Avg loss (R)', fmt(s.al), 'neg'],
      ['Compliance', pct(s.comp), (s.comp !== null && s.comp < 0.9) ? 'neg' : ''],
      ['From book', pct(s.linked), (s.linked !== null && s.linked < 0.8) ? 'neg' : '']
    ].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v ${k[2]}">${k[1]}</div></div>`).join('');

    const el = document.getElementById('curve');
    if (ts.length < 2) {
      el.innerHTML = '<div class="empty">Se desenează după primele trade-uri logate.</div>';
    } else {
      const cum = []; let c = 0;
      ts.forEach(t => { c += t.r; cum.push(c); });
      const W = 560, H = 170, PD = 24;
      const min = Math.min(0, ...cum), max = Math.max(0, ...cum), span = (max - min) || 1;
      const X = i => PD + i * (W - 2 * PD) / (cum.length - 1);
      const Y = v => H - PD - (v - min) * (H - 2 * PD) / span;
      const pts = cum.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
      const zero = Y(0).toFixed(1);
      const last = cum[cum.length - 1];
      el.innerHTML =
        `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
          <line x1="${PD}" y1="${zero}" x2="${W - PD}" y2="${zero}" stroke="#223350" stroke-dasharray="4 4"/>
          <polyline points="${pts}" fill="none" stroke="${last >= 0 ? '#2ecc71' : '#e35d5d'}" stroke-width="2"/>
          <text x="${W - PD}" y="${Y(last) - 8}" text-anchor="end" fill="${last >= 0 ? '#2ecc71' : '#e35d5d'}" font-size="12" font-weight="700">${last.toFixed(2)} R</text>
          <text x="${PD}" y="${zero - 6}" fill="#7d8ca3" font-size="10">0 R</text>
        </svg>`;
    }

    const rows = SETUPS.map(name => {
      const g = ts.filter(t => t.setup === name), gs = stats(g);
      return { name, ...gs };
    });
    const maxAbs = Math.max(0.1, ...rows.map(r => Math.abs(r.exp || 0)));
    document.getElementById('setups').innerHTML = s.n === 0
      ? '<div class="empty">Fără trade-uri încă — statisticile pornesc odată cu blotter-ul.</div>'
      : `<table><tr><th>Setup</th><th>N</th><th>WR</th><th>Exp (R)</th><th></th></tr>` +
        rows.map(r => `<tr>
          <td>${r.name}</td><td class="dim">${r.n}</td><td>${pct(r.wr)}</td>
          <td class="${cls(r.exp)}">${fmt(r.exp)}</td>
          <td style="width:30%"><div class="bar" style="width:${Math.abs(r.exp || 0) / maxAbs * 100}%;background:${(r.exp || 0) >= 0 ? 'var(--pos)' : 'var(--neg)'}"></div></td>
        </tr>`).join('') + '</table>';

    // ——— idee → execuție: fiecare trade, lângă ideea care l-a produs ———
    document.getElementById('link').innerHTML = all.length
      ? '<table><tr><th>Date</th><th>Account</th><th>Phase</th><th>Instrument</th><th>Direction</th>' +
        '<th>Setup</th><th>Idea ref</th><th>Idea outcome</th><th>R</th><th>Rules</th></tr>' +
        all.slice().reverse().map(function (t) {
          var idea = t.ideaRef ? IDEAS[t.ideaRef] : null;
          var ref = !t.ideaRef
            ? '<span class="badge b-watch" title="trade luat în afara book-ului">off-book</span>'
            : '<span class="idtag">' + t.ideaRef + '</span>' +
              (idea ? '' : ' <span class="badge b-short" title="ID inexistent în book sau în arhivă">ID necunoscut</span>');
          var out = idea && idea.src === 'history' ? outBadge(idea.o.outcome)
                  : idea ? '<span class="badge b-flat">în book</span>' : '<span class="dim">—</span>';
          return '<tr>' +
            '<td class="small">' + (t.date || '—') + '</td>' +
            '<td class="small">' + (t.account || '—') + '</td>' +
            '<td class="small">' + (t.phase || '—') + '</td>' +
            '<td><b>' + (t.instrument || '—') + '</b></td>' +
            '<td>' + dirBadge(t.dir) + '</td>' +
            '<td class="small">' + (t.setup || '—') + '</td>' +
            '<td class="small">' + ref + '</td>' +
            '<td>' + out + '</td>' +
            '<td class="' + cls(t.r) + '">' + (t.r === null || t.r === undefined ? '<span class="dim">open</span>' : fmt(t.r)) + '</td>' +
            '<td class="small">' + (t.rulesOk === 'NU'
              ? '<span class="badge b-short" title="' + (t.ruleBroken || '') + '">NU</span>'
              : (t.rulesOk || '—')) + '</td>' +
          '</tr>'; }).join('') + '</table>'
      : '<div class="empty">Se populează la „loghează:" / „loghează statement". Coloana Idea ref leagă execuția de ideea din book — fără ea, research-ul și rezultatul rămân două lucruri separate.</div>';

    // ——— research history: ce s-a ales de fiecare idee, inclusiv cele netranzacționate ———
    // Singura populație pe care blotter-ul nu o vede: ideile care n-au ajuns niciodată
    // execuție. Fără ele nu se poate separa „scorecard-ul greșește" de „execuția greșește".
    var HE = ((window.HISTORY_DATA || {}).entries || []).filter(function (e) {
      return F === 'TOT' || e.type === (F === 'A' ? 'Swing' : 'Intraday');
    });
    var dec = HE.filter(function (e) { return /VALIDAT|INVALIDAT/i.test(e.outcome || ''); });
    var ok = dec.filter(function (e) { return /^VALIDAT/i.test(e.outcome || ''); }).length;
    var rate = dec.length
      ? Math.round(100 * ok / dec.length) + '% (' + ok + ' din ' + dec.length + ')'
        + (dec.length < 20 ? ' <span class="dim">— n prea mic pentru o citire statistică</span>' : '')
      : '<span class="dim">fără idei cu deznodământ clar încă</span>';

    document.getElementById('hist').innerHTML = HE.length
      ? '<div class="small" style="margin-bottom:8px">Validation rate: ' + rate + '</div>' +
        '<table><tr><th>Closed</th><th>Instrument</th><th>Direction</th>' +
        '<th>Outcome</th><th>Ce s-a întâmplat</th></tr>' +
        HE.slice().reverse().map(function (e) {
          return '<tr>' +
            '<td class="small">' + (e.date || '—') + '</td>' +
            '<td><b>' + (e.instrument || '—') + '</b>' + ideaTag(e) + '</td>' +
            '<td>' + dirBadge(e.dir) + '</td>' +
            '<td>' + outBadge(e.outcome) + '</td>' +
            '<td class="small">' + (e.reason || '—') + '</td>' +
          '</tr>'; }).join('') + '</table>'
      : '<div class="empty">Nicio idee închisă încă. Se populează pe măsură ce ideile din book se validează, se rup sau expiră.</div>';
  }

  function wire(id, fn) {
    var tabs = document.querySelectorAll('#' + id + ' .tab');
    for (var i = 0; i < tabs.length; i++) (function (t) {
      t.addEventListener('click', function () {
        for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('on');
        t.classList.add('on'); fn(t); render();
      });
    })(tabs[i]);
  }
  wire('tabs-s', function (t) { F = t.getAttribute('data-f'); });
  wire('tabs-p', function (t) { P = t.getAttribute('data-p'); });
  render();
})();
</script>
</body>
</html>
