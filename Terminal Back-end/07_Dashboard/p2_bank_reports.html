<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Padu Terminal — Bank Reports</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome"></div>

  <div class="card">
    <h2>Bank Reports — consensus by currency</h2>
    <div id="reports"></div>
  </div>

  <div class="card">
    <h2>Bank Reports — Summary</h2>
    <div class="grid2" id="ccys"></div>
  </div>

<script src="data.js"></script>
<script src="analysis_data.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  renderChrome('p2');
  var D = window.ANALYSIS_DATA || {};
  var R = D.reports || [];

  // ——— tabel comasat pe monedă ———
  // Un rând = o monedă + o direcție, cu toate băncile care au scris-o. Argumentele nu se
  // repetă aici — trăiesc în comentariul per monedă de mai jos.
  var CORD = ['USD', 'EUR', 'GBP', 'JPY', 'CHF', 'CAD', 'AUD', 'NZD'];
  var XORD = ['Gold', 'US30'];

  // assetul scris în raport → bucket: „USD (DXY)" → USD, „EUR/USD" → EUR (direcția e a bazei)
  function bucket(a) {
    var s = String(a || '').toUpperCase(), i;
    if (s.indexOf('GOLD') > -1 || s.indexOf('XAU') > -1) return 'Gold';
    if (s.indexOf('US30') > -1 || s.indexOf('DOW') > -1) return 'US30';
    var m = s.match(/[A-Z]{3}/g) || [];
    for (i = 0; i < m.length; i++) if (CORD.indexOf(m[i]) > -1) return m[i];
    if (s.indexOf('DXY') > -1) return 'USD';
    return null;
  }
  function normDir(d) {
    var s = String(d || '').toUpperCase();
    if (s.indexOf('BULL') > -1 || s.indexOf('LONG') > -1) return 'BULLISH';
    if (s.indexOf('BEAR') > -1 || s.indexOf('SHORT') > -1) return 'BEARISH';
    return 'NEUTRU';
  }
  function dnum(d) {                       // „11.08" / „11.08.2026" → cheie sortabilă
    var m = String(d || '').match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?/);
    return m ? (m[3] || '0000') + ('0' + m[2]).slice(-2) + ('0' + m[1]).slice(-2) : '0';
  }
  function convBar(n) {
    if (!n) return '<span class="dim">—</span>';
    var r = Math.round(n), full = '', i;
    for (i = 1; i <= 5; i++) full += (i <= r ? '●' : '○');
    return '<span title="conviction ' + (Math.round(n * 10) / 10) + '/5 (medie)">' + full + '</span>';
  }

  var DORD = { BULLISH: 0, BEARISH: 1, NEUTRU: 2 };
  var byCcy = {};
  R.forEach(function (r) {
    var b = bucket(r.asset); if (!b) return;
    var d = normDir(r.dir), g = (byCcy[b] = byCcy[b] || {});
    (g[d] = g[d] || []).push(r);
  });

  // celulele unei direcții (fără Asset — acela apare o singură dată, cu rowspan)
  function dirCells(dir, rows) {
    rows = rows.slice().sort(function (a, b) { return dnum(b.date) > dnum(a.date) ? 1 : -1; });
    var banks = [], seen = {}, hint = [];
    rows.forEach(function (r) {
      if (seen[r.bank]) return;
      seen[r.bank] = 1; banks.push(r.bank); hint.push(r.bank + ' ' + (r.date || '—'));
    });
    var hz = {}, top = rows[0].horizon || '—';          // orizontul dominant; egalitate → cel mai recent
    rows.forEach(function (r) { var h = r.horizon || '—'; hz[h] = (hz[h] || 0) + 1; });
    Object.keys(hz).forEach(function (h) { if (hz[h] > hz[top]) top = h; });
    var cv = rows.filter(function (r) { return r.conviction; });
    var avg = cv.length ? cv.reduce(function (s, r) { return s + r.conviction; }, 0) / cv.length : 0;
    return '<td class="small">' + (rows[0].date || '—') + '</td>' +
      '<td>' + dirBadge(dir) + '</td>' +
      '<td class="small">' + top + '</td>' +
      '<td>' + convBar(avg) + '</td>' +
      '<td class="small" title="' + hint.join(' · ') + '">' + banks.join(', ') +
        ' <span class="dim">(' + banks.length + ')</span></td>';
  }

  var order = CORD.concat(XORD.filter(function (k) { return byCcy[k]; }));
  // Asset apare O SINGURĂ DATĂ per monedă (rowspan); direcțiile se despart pe rânduri,
  // în coloana Direction — bullish și bearish stau una sub alta, sub același activ.
  document.getElementById('reports').innerHTML = R.length
    ? '<table><tr><th>Asset</th><th>Date</th><th>Direction</th><th>Horizon</th><th>Conviction</th><th>Banks</th></tr>' +
      order.map(function (ccy) {
        var g = byCcy[ccy] || {}, sep = ' style="border-top:1px solid var(--line)"';
        var dirs = Object.keys(g).sort(function (a, b) {
          return (g[b].length - g[a].length) || (DORD[a] - DORD[b]); });
        if (!dirs.length) return '<tr' + sep + '><td><b>' + ccy + '</b></td>' +
          '<td class="dim" colspan="5">fără rapoarte săptămâna aceasta</td></tr>';
        var head = '<td rowspan="' + dirs.length + '"><b>' + ccy + '</b>' +
          (g['BULLISH'] && g['BEARISH'] ? ' <span class="badge b-watch" title="bănci în contradicție pe acest activ">⚔</span>' : '') + '</td>';
        return dirs.map(function (d, i) {
          return '<tr' + (i === 0 ? sep : '') + '>' + (i === 0 ? head : '') + dirCells(d, g[d]) + '</tr>';
        }).join('');
      }).join('') + '</table>'
    : '<div class="empty">Se populează la „procesează inbox".</div>';

  // ——— per monedă ———
  var cy = D.currencies || {};
  document.getElementById('ccys').innerHTML = Object.keys(cy).length
    ? CORD.filter(function (k) { return cy[k]; }).map(function (k) {
        var c = cy[k];
        return '<div class="ccy">' +
          '<div class="hd"><h3>' + k + '</h3><span class="tag">' + (c.core ? 'CORE' : 'SECONDARY') + '</span>' + dirBadge(c.bias) + '</div>' +
          '<div class="blk" style="margin-bottom:0"><p>' + (c.banks || '—') + '</p></div>' +
        '</div>'; }).join('')
    : '<div class="empty" style="grid-column:1/-1">Se populează la „procesează inbox".</div>';
})();
</script>
</body>
</html>
